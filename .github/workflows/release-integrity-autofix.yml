name: Release integrity v1.0.5 autofix

on:
  push:
    branches:
      - fix/release-integrity-v1.0.5

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install current dependencies
        run: npm ci

      - name: Apply integrity fixes and regression tests
        run: python3 scripts/release-integrity-patch-v105.py

      - name: Refresh package lock and apply non-breaking audit fixes
        run: |
          npm install --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only

      - name: Reinstall resolved dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Check lint, types, tests and production build
        run: npm run check

      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Chromium E2E
        run: npm run test:e2e

      - name: Firefox and WebKit core smoke
        run: npm run test:e2e:cross-browser

      - name: Diff hygiene
        run: git diff --check

      - name: Commit verified release-integrity fix
        run: |
          git rm .github/workflows/release-integrity-autofix.yml
          git rm scripts/release-integrity-patch-v105.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(release): harden data integrity and dependency security (v1.0.5)"
          git push origin HEAD:fix/release-integrity-v1.0.5

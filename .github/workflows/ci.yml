name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Check (lint + typecheck + unit/contract/integration + build)
        run: npm run check

  live-data-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Probe weather, satellite, geocoding, air quality and Kp providers
        run: npm run test:live

  container-smoke:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate merged Compose configuration
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.aliyun.yml \
            config --quiet

      - name: Validate Nginx template
        run: |
          mkdir -p /tmp/star-photo-certs
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout /tmp/star-photo-certs/privkey.pem \
            -out /tmp/star-photo-certs/fullchain.pem \
            -days 1 -subj '/CN=stars.example.com' >/dev/null 2>&1
          docker run --rm \
            -v "$PWD/deploy/nginx/star-photo.conf:/etc/nginx/conf.d/star-photo.conf:ro" \
            -v "/tmp/star-photo-certs:/etc/letsencrypt/live/stars.example.com:ro" \
            nginx:1.27-alpine nginx -t

      - name: Build production image
        env:
          BUILD_REVISION: ${{ github.sha }}
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.aliyun.yml \
            build star-weather

      - name: Start and probe production container
        env:
          BUILD_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          cleanup() {
            docker compose \
              -f docker-compose.yml \
              -f docker-compose.aliyun.yml \
              down --remove-orphans || true
          }
          trap cleanup EXIT

          docker compose \
            -f docker-compose.yml \
            -f docker-compose.aliyun.yml \
            up -d --no-deps star-weather

          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3100/healthz > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 1
          done

          docker compose \
            -f docker-compose.yml \
            -f docker-compose.aliyun.yml \
            logs star-weather
          exit 1

  e2e:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run production E2E tests
        run: npm run test:e2e

      - name: Upload Chromium failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-chromium-${{ github.run_id }}
          path: |
            playwright-report
            node_modules/.cache/playwright-results
          if-no-files-found: ignore
          retention-days: 7

  cross-browser-smoke:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Firefox and WebKit
        run: npx playwright install --with-deps firefox webkit

      - name: Run Firefox/WebKit core smoke
        run: npm run test:e2e:cross-browser

      - name: Upload cross-browser failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-cross-browser-${{ github.run_id }}
          path: |
            playwright-report-cross-browser
            node_modules/.cache/playwright-results-cross-browser
          if-no-files-found: ignore
          retention-days: 7

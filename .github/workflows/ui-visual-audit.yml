name: UI visual audit v1.0.4

on:
  push:
    branches:
      - audit/ui-information-architecture-20260829
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture deployed product pages
        env:
          AUDIT_BASE_URL: https://photo.joviluma.com
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from "@playwright/test";
          import fs from "node:fs/promises";

          const baseUrl = process.env.AUDIT_BASE_URL;
          const outputDir = "ui-audit-output";
          const selected =
            "lat=30.1734&lng=118.9057&name=%E5%A4%AA%E5%AD%90%E5%B0%96&" +
            "elevation=1557&model=icon";
          const routes = [
            { id: "01-tonight", label: "今夜观测", url: `${baseUrl}/?${selected}`, waitMs: 22000 },
            { id: "02-sites", label: "暗夜选址", url: `${baseUrl}/sites?${selected}`, waitMs: 22000 },
            { id: "03-cloudsea", label: "高山云海", url: `${baseUrl}/cloudsea?${selected}`, waitMs: 24000 },
            { id: "04-fireglow", label: "火烧云", url: `${baseUrl}/fireglow?${selected}`, waitMs: 24000 },
            { id: "05-planner", label: "观星计划兼容入口", url: `${baseUrl}/planner?${selected}`, waitMs: 22000 },
          ];
          const profiles = [
            { id: "desktop-1440", viewport: { width: 1440, height: 1000 }, isMobile: false, hasTouch: false },
            { id: "tablet-1024", viewport: { width: 1024, height: 768 }, isMobile: false, hasTouch: true },
            { id: "mobile-390", viewport: { width: 390, height: 844 }, isMobile: true, hasTouch: true },
          ];

          await fs.mkdir(outputDir, { recursive: true });
          const browser = await chromium.launch({ headless: true });
          const report = {
            generatedAt: new Date().toISOString(),
            baseUrl,
            health: null,
            dataStatus: null,
            profiles: [],
          };

          const requestContext = await browser.newContext({ ignoreHTTPSErrors: true });
          for (const [key, path] of [["health", "/healthz"], ["dataStatus", "/api/data-status"]]) {
            try {
              const response = await requestContext.request.get(`${baseUrl}${path}`, { timeout: 60000 });
              report[key] = {
                status: response.status(),
                headers: response.headers(),
                body: await response.text(),
              };
            } catch (error) {
              report[key] = { error: error instanceof Error ? error.message : String(error) };
            }
          }
          await requestContext.close();

          const captureMetrics = () => {
            const visible = (element) => {
              const style = getComputedStyle(element);
              const rect = element.getBoundingClientRect();
              return style.display !== "none" && style.visibility !== "hidden" && rect.width > 1 && rect.height > 1;
            };
            const regions = Array.from(document.querySelectorAll(
              "header,nav,aside,[class*='panel'],[class*='drawer'],[class*='card'],[class*='inspector'],[class*='timeline'],[class*='detail']"
            ))
              .filter(visible)
              .slice(0, 220)
              .map((element) => {
                const rect = element.getBoundingClientRect();
                const style = getComputedStyle(element);
                return {
                  tag: element.tagName.toLowerCase(),
                  className: String(element.className || "").slice(0, 180),
                  text: String(element.textContent || "").replace(/\s+/g, " ").trim().slice(0, 240),
                  rect: {
                    x: Math.round(rect.x), y: Math.round(rect.y),
                    width: Math.round(rect.width), height: Math.round(rect.height),
                  },
                  position: style.position,
                  zIndex: style.zIndex,
                  overflowX: style.overflowX,
                  overflowY: style.overflowY,
                };
              });
            const text = document.body.innerText;
            return {
              title: document.title,
              url: location.href,
              viewport: { width: innerWidth, height: innerHeight },
              document: {
                scrollWidth: document.documentElement.scrollWidth,
                scrollHeight: document.documentElement.scrollHeight,
                bodyScrollWidth: document.body.scrollWidth,
                bodyScrollHeight: document.body.scrollHeight,
              },
              horizontalOverflow:
                document.documentElement.scrollWidth > innerWidth + 1 ||
                document.body.scrollWidth > innerWidth + 1,
              visibleButtons: Array.from(document.querySelectorAll("button")).filter(visible).length,
              visibleInputs: Array.from(document.querySelectorAll("input,select,textarea")).filter(visible).length,
              textFlags: {
                noData: (text.match(/无数据/g) || []).length,
                unavailable: (text.match(/不可用/g) || []).length,
                notInstalled: (text.match(/未安装/g) || []).length,
                loading: (text.match(/加载|读取|计算中/g) || []).length,
                error: (text.match(/错误|失败/g) || []).length,
              },
              regions,
            };
          };

          for (const profile of profiles) {
            const context = await browser.newContext({
              viewport: profile.viewport,
              isMobile: profile.isMobile,
              hasTouch: profile.hasTouch,
              locale: "zh-CN",
              timezoneId: "Asia/Shanghai",
              ignoreHTTPSErrors: true,
              deviceScaleFactor: 1,
              reducedMotion: "reduce",
            });
            await context.addInitScript(() => {
              try {
                localStorage.clear();
                sessionStorage.clear();
              } catch {}
            });

            const profileReport = { id: profile.id, viewport: profile.viewport, pages: [] };
            for (const route of routes) {
              const page = await context.newPage();
              const entry = {
                id: route.id,
                label: route.label,
                requestedUrl: route.url,
                finalUrl: null,
                status: null,
                durationMs: null,
                navigationError: null,
                consoleErrors: [],
                failedRequests: [],
                screenshotFull: null,
                screenshotViewport: null,
                metrics: null,
                interactions: [],
              };
              page.on("console", (message) => {
                if (message.type() === "error") entry.consoleErrors.push(message.text());
              });
              page.on("pageerror", (error) => entry.consoleErrors.push(error.message));
              page.on("requestfailed", (request) => entry.failedRequests.push({
                url: request.url(),
                error: request.failure()?.errorText ?? "unknown",
              }));

              const started = Date.now();
              try {
                const response = await page.goto(route.url, { waitUntil: "domcontentloaded", timeout: 120000 });
                entry.status = response?.status() ?? null;
                await page.locator(".leaflet-container").first().waitFor({ state: "visible", timeout: 30000 }).catch(() => undefined);
                await page.waitForTimeout(route.waitMs);
                await page.evaluate(async () => { if (document.fonts?.ready) await document.fonts.ready; }).catch(() => undefined);
                entry.finalUrl = page.url();
                entry.metrics = await page.evaluate(captureMetrics);
                entry.screenshotViewport = `${outputDir}/${profile.id}-${route.id}-viewport.png`;
                entry.screenshotFull = `${outputDir}/${profile.id}-${route.id}-full.png`;
                await page.screenshot({ path: entry.screenshotViewport, fullPage: false });
                await page.screenshot({ path: entry.screenshotFull, fullPage: true });

                const disclosure = page.getByRole("button", { name: /数据依据|数据来源|依据与局限/ }).first();
                if (await disclosure.isVisible().catch(() => false)) {
                  await disclosure.click().catch(() => undefined);
                  await page.waitForTimeout(800);
                  const path = `${outputDir}/${profile.id}-${route.id}-disclosure.png`;
                  await page.screenshot({ path, fullPage: false });
                  entry.interactions.push({ id: "disclosure", screenshot: path });
                  await page.keyboard.press("Escape").catch(() => undefined);
                }

                if (profile.id === "mobile-390" && ["01-tonight", "02-sites"].includes(route.id)) {
                  for (const testId of [
                    "mobile-map-panel-open-layers",
                    "mobile-map-panel-open-places",
                    "mobile-map-panel-open-cloud",
                    "mobile-map-panel-open-recommendations",
                  ]) {
                    const trigger = page.getByTestId(testId);
                    if (!(await trigger.isVisible().catch(() => false))) continue;
                    await trigger.click();
                    await page.waitForTimeout(700);
                    const path = `${outputDir}/${profile.id}-${route.id}-${testId}.png`;
                    await page.screenshot({ path, fullPage: false });
                    entry.interactions.push({ id: testId, screenshot: path });
                    const close = page.getByRole("button", { name: /关闭.*侧边栏|关闭地图工具/ }).last();
                    if (await close.isVisible().catch(() => false)) await close.click().catch(() => page.keyboard.press("Escape"));
                    else await page.keyboard.press("Escape");
                    await page.waitForTimeout(350);
                  }
                }
              } catch (error) {
                entry.navigationError = error instanceof Error ? error.message : String(error);
                const path = `${outputDir}/${profile.id}-${route.id}-failure.png`;
                await page.screenshot({ path, fullPage: true }).catch(() => undefined);
                entry.failureScreenshot = path;
              }
              entry.durationMs = Date.now() - started;
              entry.failedRequests = entry.failedRequests.slice(0, 120);
              entry.consoleErrors = entry.consoleErrors.slice(0, 80);
              profileReport.pages.push(entry);
              await page.close();
            }
            report.profiles.push(profileReport);
            await context.close();
          }

          await browser.close();
          await fs.writeFile(`${outputDir}/audit-report.json`, JSON.stringify(report, null, 2), "utf8");
          const summary = [
            "# 逐星 v1.0.4 线上视觉审计采集",
            "",
            `生成时间：${report.generatedAt}`,
            `站点：${report.baseUrl}`,
            "",
            ...report.profiles.flatMap((profile) => [
              `## ${profile.id}`,
              "",
              ...profile.pages.map((page) =>
                `- ${page.label}: HTTP ${page.status ?? "n/a"}; ${page.finalUrl ?? page.navigationError}; 横向溢出 ${page.metrics?.horizontalOverflow ? "是" : "否"}; console error ${page.consoleErrors.length}; failed request ${page.failedRequests.length}`
              ),
              "",
            ]),
          ];
          await fs.writeFile(`${outputDir}/README.md`, summary.join("\n"), "utf8");
          NODE

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-visual-audit-${{ github.run_id }}
          path: ui-audit-output
          if-no-files-found: error
          retention-days: 7

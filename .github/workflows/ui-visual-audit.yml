name: UI visual audit

on:
  push:
    branches:
      - audit/ui-information-architecture-20260829

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture populated product workflows
        env:
          AUDIT_BASE_URL: https://photo.joviluma.com
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from "@playwright/test";
          import fs from "node:fs/promises";

          const baseUrl = process.env.AUDIT_BASE_URL;
          const outputDir = "ui-audit-output";
          const selectedQuery =
            "lat=30.1734&lng=118.9057&name=%E5%A4%AA%E5%AD%90%E5%B0%96&" +
            "elevation=1557&model=icon&overlay=forecast-cloud";
          const seedLocations = [
            { id: "qianniugang", name: "牵牛岗", latitude: 30.026, longitude: 119.007, elevation: 1489.9, timezone: "Asia/Shanghai", source: "审计点位" },
            { id: "taizijian", name: "太子尖", latitude: 30.1734, longitude: 118.9057, elevation: 1557, timezone: "Asia/Shanghai", source: "审计点位" },
            { id: "baizhangling", name: "百丈岭", latitude: 30.1839, longitude: 119.0129, elevation: 1558, timezone: "Asia/Shanghai", source: "审计点位" },
            { id: "tianhuangping", name: "天荒坪", latitude: 30.4694, longitude: 119.5978, elevation: 958.4, timezone: "Asia/Shanghai", source: "审计点位" },
            { id: "simingshan", name: "四明山", latitude: 29.6352, longitude: 120.9819, elevation: 1018, timezone: "Asia/Shanghai", source: "审计点位" },
          ];
          const routes = [
            { id: "00-reference", label: "参考站", url: "https://perseids.giraffetree.cn/", waitMs: 16000 },
            { id: "01-home-selected", label: "今夜观测 · 已选地点", url: `${baseUrl}/?${selectedQuery}`, waitMs: 22000 },
            { id: "02-sites-selected", label: "暗夜选址 · 已选地点", url: `${baseUrl}/sites?${selectedQuery}`, waitMs: 22000 },
            { id: "03-fireglow", label: "火烧云", url: `${baseUrl}/fireglow`, waitMs: 20000 },
            { id: "04-planner-populated", label: "观星计划 · 已填充", url: `${baseUrl}/planner?${selectedQuery}`, waitMs: 32000 },
          ];
          const profiles = [
            { id: "desktop", viewport: { width: 1440, height: 1000 }, isMobile: false, hasTouch: false },
            { id: "mobile-390", viewport: { width: 390, height: 844 }, isMobile: true, hasTouch: true },
          ];

          await fs.mkdir(outputDir, { recursive: true });
          const report = { generatedAt: new Date().toISOString(), baseUrl, profiles: [] };
          const browser = await chromium.launch({ headless: true });

          const metrics = () => ({
            title: document.title,
            url: location.href,
            viewport: { width: innerWidth, height: innerHeight },
            document: {
              scrollWidth: document.documentElement.scrollWidth,
              scrollHeight: document.documentElement.scrollHeight,
              bodyScrollWidth: document.body.scrollWidth,
              bodyScrollHeight: document.body.scrollHeight,
            },
            horizontalOverflow:
              document.documentElement.scrollWidth > innerWidth + 1 ||
              document.body.scrollWidth > innerWidth + 1,
            fixedRegions: Array.from(document.querySelectorAll("header,nav,aside,[class*='panel'],[class*='drawer'],[class*='timeline']"))
              .map((element) => {
                const style = getComputedStyle(element);
                const rect = element.getBoundingClientRect();
                return {
                  className: String(element.className || "").slice(0, 160),
                  text: String(element.textContent || "").replace(/\s+/g, " ").trim().slice(0, 200),
                  position: style.position,
                  zIndex: style.zIndex,
                  rect: {
                    x: Math.round(rect.x), y: Math.round(rect.y),
                    width: Math.round(rect.width), height: Math.round(rect.height),
                  },
                };
              })
              .filter((item) => item.rect.width > 1 && item.rect.height > 1)
              .slice(0, 160),
          });

          for (const profile of profiles) {
            const context = await browser.newContext({
              viewport: profile.viewport,
              isMobile: profile.isMobile,
              hasTouch: profile.hasTouch,
              locale: "zh-CN",
              timezoneId: "Asia/Shanghai",
              ignoreHTTPSErrors: true,
              deviceScaleFactor: 1,
            });
            await context.addInitScript((locations) => {
              try {
                localStorage.clear();
                sessionStorage.clear();
                if (location.hostname === "photo.joviluma.com") {
                  localStorage.setItem("perseids-locations-v1", JSON.stringify(locations));
                }
              } catch {
                // about:blank and foreign origins may not expose storage.
              }
            }, seedLocations);

            const profileReport = { id: profile.id, viewport: profile.viewport, pages: [] };
            for (const route of routes) {
              const page = await context.newPage();
              const pageReport = {
                id: route.id,
                label: route.label,
                requestedUrl: route.url,
                responseStatus: null,
                finalUrl: null,
                navigationError: null,
                consoleErrors: [],
                failedRequests: [],
                screenshot: null,
                metrics: null,
                states: [],
                interactionFindings: [],
              };
              page.on("console", (message) => {
                if (message.type() === "error") pageReport.consoleErrors.push(message.text());
              });
              page.on("pageerror", (error) => pageReport.consoleErrors.push(error.message));
              page.on("requestfailed", (request) => pageReport.failedRequests.push({
                url: request.url(), error: request.failure()?.errorText ?? "unknown",
              }));

              try {
                const response = await page.goto(route.url, { waitUntil: "domcontentloaded", timeout: 120000 });
                pageReport.responseStatus = response?.status() ?? null;
                await page.locator(".leaflet-container").first().waitFor({ state: "visible", timeout: 30000 }).catch(() => undefined);
                await page.waitForTimeout(route.waitMs);
                await page.evaluate(async () => { if (document.fonts?.ready) await document.fonts.ready; }).catch(() => undefined);
                pageReport.finalUrl = page.url();
                pageReport.metrics = await page.evaluate(metrics);
                pageReport.screenshot = `${outputDir}/${profile.id}-${route.id}-full.png`;
                await page.screenshot({ path: pageReport.screenshot, fullPage: true });

                if (route.id === "04-planner-populated") {
                  const detailButton = page.locator(".detail-cta").first();
                  if (await detailButton.isVisible().catch(() => false)) {
                    await detailButton.click({ force: true, timeout: 8000 });
                    await page.locator(".detail-drawer").waitFor({ state: "visible", timeout: 15000 }).catch(() => undefined);
                    await page.waitForTimeout(1800);
                    const detailPath = `${outputDir}/${profile.id}-${route.id}-detail.png`;
                    await page.screenshot({ path: detailPath, fullPage: false });
                    const state = { id: "detail", screenshot: detailPath, metrics: await page.evaluate(metrics) };
                    const closeButton = page.getByRole("button", { name: "关闭详情" }).first();
                    if (await closeButton.isVisible().catch(() => false)) {
                      try {
                        await closeButton.click({ timeout: 3500 });
                      } catch (error) {
                        const message = error instanceof Error ? error.message : String(error);
                        state.closeButtonBlocked = message;
                        pageReport.interactionFindings.push("详情关闭按钮被顶部控件拦截点击；改用 Escape 关闭");
                        await page.keyboard.press("Escape");
                      }
                    }
                    pageReport.states.push(state);
                    await page.waitForTimeout(600);
                  }

                  const matrixButton = page.getByRole("button", { name: "对比", exact: true }).first();
                  if (await matrixButton.isVisible().catch(() => false)) {
                    await matrixButton.click({ force: true, timeout: 8000 });
                    await page.waitForTimeout(1600);
                    const matrixPath = `${outputDir}/${profile.id}-${route.id}-matrix-full.png`;
                    await page.screenshot({ path: matrixPath, fullPage: true });
                    pageReport.states.push({ id: "matrix", screenshot: matrixPath, metrics: await page.evaluate(metrics) });
                  }
                }
              } catch (error) {
                pageReport.navigationError = error instanceof Error ? error.message : String(error);
                const failurePath = `${outputDir}/${profile.id}-${route.id}-failure.png`;
                await page.screenshot({ path: failurePath, fullPage: true }).catch(() => undefined);
                pageReport.failureScreenshot = failurePath;
              }

              pageReport.failedRequests = pageReport.failedRequests.slice(0, 100);
              profileReport.pages.push(pageReport);
              await fs.writeFile(`${outputDir}/audit-report.partial.json`, JSON.stringify(report, null, 2), "utf8");
              await page.close();
            }
            report.profiles.push(profileReport);
            await context.close();
          }

          await browser.close();
          await fs.writeFile(`${outputDir}/audit-report.json`, JSON.stringify(report, null, 2), "utf8");
          await fs.writeFile(`${outputDir}/README.md`, [
            "# 逐星线上 UI 典型任务态视觉审计",
            "",
            `生成时间：${report.generatedAt}`,
            "",
            ...report.profiles.flatMap((profile) => [
              `## ${profile.id}`,
              "",
              ...profile.pages.flatMap((page) => [
                `- ${page.label}: HTTP ${page.responseStatus ?? "n/a"}; 横向溢出 ${page.metrics?.horizontalOverflow ? "是" : "否"}; 截图 ${page.screenshot ?? page.failureScreenshot ?? "无"}`,
                ...page.states.map((state) => `  - ${state.id}: ${state.screenshot}`),
                ...page.interactionFindings.map((finding) => `  - 交互缺陷：${finding}`),
              ]),
              "",
            ]),
          ].join("\n"), "utf8");
          NODE

      - name: Upload visual audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-visual-audit-${{ github.run_id }}
          path: ui-audit-output
          if-no-files-found: warn
          retention-days: 7

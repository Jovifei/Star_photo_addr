# 逐星 live configuration — photo.joviluma.com (HTTPS) + raw-IP HTTP access.
# Layout coexists with jourvolt.conf (teslalink.* blocks, server_name-exact).
# Replace the certificate via `certbot renew` (timer keeps it fresh).

limit_req_zone $binary_remote_addr zone=star_photo_api:10m rate=12r/s;
limit_conn_zone $binary_remote_addr zone=star_photo_conn:10m;

upstream star_photo_app {
    server 127.0.0.1:3100;
    keepalive 32;
}

# Raw-IP access keeps working over plain HTTP (no Host match).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 2m;
    limit_conn star_photo_conn 40;

    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }

    location = /healthz {
        proxy_pass http://star_photo_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        access_log off;
    }

    location /api/ {
        limit_req zone=star_photo_api burst=30 nodelay;
        proxy_pass http://star_photo_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 150s;
        proxy_read_timeout 150s;
        proxy_buffering on;
        proxy_buffers 16 16k;
        proxy_busy_buffers_size 32k;
    }

    location /_next/static/ {
        proxy_pass http://star_photo_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        proxy_pass http://star_photo_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# Domain: send everything to HTTPS (ACME challenges still answered here).
server {
    listen 80;
    listen [::]:80;
    server_name photo.joviluma.com joviluma.com;

    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / {
        return 301 https://photo.joviluma.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name photo.joviluma.com;

    ssl_certificate     /etc/letsencrypt/live/photo.joviluma.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/photo.joviluma.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:STARPHOTO_TLS:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 2m;
    limit_conn star_photo_conn 40;


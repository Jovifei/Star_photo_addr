# Install as /etc/nginx/conf.d/star-photo.conf.
# Replace stars.example.com and enable the TLS server after certificates exist.

limit_req_zone $binary_remote_addr zone=star_photo_api:10m rate=12r/s;
limit_conn_zone $binary_remote_addr zone=star_photo_conn:10m;

map $http_upgrade $star_photo_connection_upgrade {
    default upgrade;
    ''      close;
}

upstream star_photo_app {
    server 127.0.0.1:3100;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name stars.example.com;

    # Before HTTPS is ready, replace this return with the proxy locations from
    # the TLS server below. Once certificates exist, keep this redirect.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name stars.example.com;

    ssl_certificate     /etc/letsencrypt/live/stars.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stars.example.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:STARPHOTO_TLS:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Opt in only after the final hostname and HTTPS chain are verified.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 2m;
    limit_conn star_photo_conn 40;

    location = /healthz {
        proxy_pass http://star_photo_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # Public read-only APIs are rate-limited at the edge. Application-level
    # refresh cooldown and request coalescing remain the second line of defence.
    location /api/ {
        limit_req zone=star_photo_api burst=30 nodelay;
        proxy_pass http://star_photo_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 150s;
        proxy_read_timeout 150s;
        proxy_buffering on;
        proxy_buffers 16 16k;
        proxy_busy_buffers_size 32k;
    }

    location /_next/static/ {
        proxy_pass http://star_photo_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        proxy_pass http://star_photo_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $star_photo_connection_upgrade;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

services:
  star-weather:
    build: .
    ports:
      - "${APP_PORT:-3100}:3000"
    environment:
      OBSERVING_SNAPSHOT_DIR: /app/data/snapshots
    volumes:
      - observing-snapshots:/app/data/snapshots
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 3s
      retries: 5
  star-weather-worker:
    build: .
    command: ["node", "scripts/observing-snapshot-worker.mjs"]
    environment:
      OBSERVING_SNAPSHOT_DIR: /app/data/snapshots
      SNAPSHOT_BASE_URL: http://star-weather:3000
      SNAPSHOT_INTERVAL_MS: 1800000
      SNAPSHOT_DAYS: 7
      SNAPSHOT_MODEL: icon
    volumes:
      - observing-snapshots:/app/data/snapshots
    depends_on:
      star-weather:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "ps -o args | grep -q '[o]bserving-snapshot-worker.mjs'"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped

volumes:
  observing-snapshots:
